name: Logbook Reminder
on:
  schedule:
    - cron: '0 2 * * 1-5'   # 09:00 WIB — cek pagi (laptop nyala atau tidak)
    - cron: '0 5 * * 1-5'   # 12:00 WIB — cek siang (kalau masih belum nyala)
    - cron: '0 9 * * 1-5'   # 16:00 WIB — cek sore (backup kalau masih izin)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_TOKEN: "8975600757:AAHb0VIZc7qcB1eDFBW9TCWm3XmOFVdmveA"
      CHAT_ID: "1259136419"
      GH_TOKEN: "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"
      GIST_ID: "a632595c5367e8957ed93d1110602f5b"
    steps:
      - name: Check heartbeat and remind if needed
        run: |
          cat > /tmp/reminder.mjs << 'ENDSCRIPT'
          const token = process.env.TELEGRAM_TOKEN;
          const chatId = process.env.CHAT_ID;
          const ghToken = process.env.GH_TOKEN;
          const gistId = process.env.GIST_ID;

          function getTodayWIB() {
            return new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).split(' ')[0];
          }

          function getNowHourWIB() {
            return parseInt(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta', hour: 'numeric', hour12: false }));
          }

          async function checkHeartbeat() {
            const today = getTodayWIB();
            const r = await fetch('https://api.github.com/gists/' + gistId, {
              headers: { Authorization: 'token ' + ghToken, Accept: 'application/vnd.github.v3+json' }
            });
            const d = await r.json();
            const hb = JSON.parse(d.files['heartbeat.json'].content);
            console.log('Heartbeat date:', hb.date, '| Today WIB:', today);
            return hb.date === today;
          }

          async function sendMsg(text, keyboard) {
            const body = { chat_id: chatId, text, parse_mode: 'Markdown' };
            if (keyboard) body.reply_markup = { inline_keyboard: keyboard };
            const r = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
            const d = await r.json();
            if (!d.ok) console.log('Telegram error:', JSON.stringify(d));
            return d;
          }

          async function getLastId() {
            const r = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=1&timeout=0');
            const d = await r.json();
            if (d.ok && d.result.length) return d.result[d.result.length - 1].update_id;
            return 0;
          }

          async function checkReply(lastId) {
            const r = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?offset=' + (lastId + 1) + '&timeout=2&limit=5');
            const d = await r.json();
            if (d.ok && d.result.length > 0) {
              return { replied: true, lastId: d.result[d.result.length - 1].update_id };
            }
            return { replied: false, lastId };
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          const SPAMS = [
            '📋 *Logbook belum diisi nih!*\nSeperti nya kamu izin atau WFH hari ini—jangan lupa isi logbook manual ya!\n\nBalas pesan ini untuk dapat link langsung! 👇',
            '🔔 *Reminder: Logbook MagangHub!*\nLogbook hari ini belum terdeteksi diisi.\nBalas pesan ini untuk dapat link pengisian! 👇',
            '📌 *Hei, cek logbook dulu!*\nSudah siang nih, logbook belum keisi.\nBalas untuk dapat link langsung! 👇',
            '⏰ *Jangan lupa logbook!*\nMasih ada waktu, langsung isi ya!\nBalas pesan ini untuk link pengisian! 👇',
            '🚨 *Logbook belum diisi!*\nSudah sore, segera isi sebelum lupa!\nBalas pesan ini! 👇',
          ];

          const INTERVAL_MS = 15 * 60 * 1000; // 15 menit antar reminder (aman dari Telegram ban)
          const MAX_REMINDERS = 6; // max 6 per run = cover ~90 menit

          async function main() {
            const today = getTodayWIB();
            const nowHour = getNowHourWIB();
            const logbookLink = 'https://monev.maganghub.kemnaker.go.id/dashboard/riwayat?date=' + today + '&view=edit';

            console.log('Jam WIB:', nowHour + ':xx | Tanggal:', today);

            // Jangan kirim alert di luar jam kerja (sebelum 09:00 atau setelah 20:00)
            if (nowHour < 9 || nowHour >= 20) {
              console.log('Di luar jam kerja (sebelum 09:00 atau setelah 20:00), skip.');
              return;
            }

            const laptopOn = await checkHeartbeat().catch(() => false);
            if (laptopOn) {
              console.log('Laptop nyala hari ini, logbook automation berjalan. Exit.');
              return;
            }

            console.log('Laptop tidak terdeteksi (kemungkinan izin). Mulai kirim reminder...');
            let lastId = await getLastId();
            let count = 0;
            let replied = false;

            while (count < MAX_REMINDERS && !replied) {
              // Cek reply dulu sebelum kirim
              const c1 = await checkReply(lastId);
              lastId = c1.lastId;
              if (c1.replied) { replied = true; break; }

              const msg = SPAMS[count % SPAMS.length];
              await sendMsg(msg);
              count++;
              console.log('[Reminder #' + count + '] terkirim jam ' + new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'}));

              // Tunggu 15 menit sambil cek reply tiap 1 menit
              for (let i = 0; i < 15 && !replied; i++) {
                await sleep(60 * 1000); // 1 menit
                const c2 = await checkReply(lastId);
                lastId = c2.lastId;
                if (c2.replied) { replied = true; }
              }
            }

            if (replied) {
              await sendMsg('✅ *Oke! Langsung isi logbook di sini:*\n\n👉 ' + logbookLink + '\n\n_Ingat: tutup jam 23:59 malam ini!_');
              console.log('User replied, link logbook dikirim.');
            } else {
              console.log('Max reminder (' + MAX_REMINDERS + 'x) tercapai untuk run ini. Run berikutnya akan cek lagi.');
            }
          }

          main().catch(e => { console.error(e); process.exit(1); });
          ENDSCRIPT
          node /tmp/reminder.mjs