name: Logbook Reminder
on:
  schedule:
    - cron: '0 2 * * 1-5'    # 09:00 WIB — cek pagi + spam 1 jam pertama
    - cron: '0 4 * * 1-5'    # 11:00 WIB — lanjut 15 menit
    - cron: '0 6 * * 1-5'    # 13:00 WIB — lanjut 15 menit
    - cron: '0 8 * * 1-5'    # 15:00 WIB — lanjut 15 menit
    - cron: '0 10 * * 1-5'   # 17:00 WIB — lanjut 15 menit
    - cron: '0 12 * * 1-5'   # 19:00 WIB — lanjut 15 menit
    - cron: '0 14 * * 1-5'   # 21:00 WIB — lanjut 15 menit
    - cron: '0 16 * * 1-5'   # 23:00 WIB — run terakhir sebelum midnight
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_TOKEN: "8975600757:AAHb0VIZc7qcB1eDFBW9TCWm3XmOFVdmveA"
      CHAT_ID: "1259136419"
      GH_TOKEN: "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"
      GIST_ID: "a632595c5367e8957ed93d1110602f5b"
    steps:
      - name: Check heartbeat and remind if needed
        run: |
          cat > /tmp/reminder.mjs << 'ENDSCRIPT'
          const token = process.env.TELEGRAM_TOKEN;
          const chatId = process.env.CHAT_ID;
          const ghToken = process.env.GH_TOKEN;
          const gistId = process.env.GIST_ID;

          function getTodayWIB() {
            return new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).split(' ')[0];
          }

          function getNowHourWIB() {
            const s = new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta', hour: 'numeric', hour12: false });
            return parseInt(s);
          }

          async function checkHeartbeat() {
            const today = getTodayWIB();
            const r = await fetch('https://api.github.com/gists/' + gistId, {
              headers: { Authorization: 'token ' + ghToken, Accept: 'application/vnd.github.v3+json' }
            });
            const d = await r.json();
            const hb = JSON.parse(d.files['heartbeat.json'].content);
            console.log('Heartbeat date:', hb.date, '| Today WIB:', today);
            return hb.date === today;
          }

          async function sendMsg(text, keyboard) {
            const body = { chat_id: chatId, text, parse_mode: 'Markdown' };
            if (keyboard) body.reply_markup = { inline_keyboard: keyboard };
            await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body)
            });
          }

          async function getLastId() {
            const r = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=1&timeout=0');
            const d = await r.json();
            if (d.ok && d.result.length) return d.result[d.result.length - 1].update_id;
            return 0;
          }

          async function checkReply(lastId) {
            const r = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?offset=' + (lastId + 1) + '&timeout=2&limit=5');
            const d = await r.json();
            if (d.ok && d.result.length > 0) {
              return { replied: true, lastId: d.result[d.result.length - 1].update_id };
            }
            return { replied: false, lastId };
          }

          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          const SPAMS = [
            '⚠️ *LOGBOOK BELUM DIISI!*\nKamu sepertinya izin hari ini—jangan lupa isi logbook manual!\n\nBalas pesan ini untuk dapat link langsung! 👇',
            '🔔 *PENGINGAT LOGBOOK!*\nLogbook MagangHub belum terisi hari ini!\nBalas untuk dapat link pengisian! 👇',
            '📋 *Hei, logbook dulu!*\nJangan sampai lupa ya—deadline 23:59 malam ini!\nBalas pesan ini! 👇',
            '🚨 *LOGBOOK BELUM KEISI!*\nSegera isi sebelum kelewatan!\nBalas untuk link langsung! 👇',
            '⏰ *Jangan lupa logbook!*\nMasih ada waktu, balas pesan ini untuk link pengisian! 👇',
          ];

          async function main() {
            const today = getTodayWIB();
            const nowHour = getNowHourWIB();
            const logbookLink = 'https://monev.maganghub.kemnaker.go.id/dashboard/riwayat?date=' + today + '&view=edit';

            console.log('Jam WIB sekarang:', nowHour + ':xx | Tanggal:', today);

            // Jangan kirim alert setelah 23:00 (mendekati midnight)
            if (nowHour >= 23) {
              console.log('Jam 23:xx — run terakhir sebelum midnight, kirim 1 reminder saja.');
              const laptopOn = await checkHeartbeat().catch(() => false);
              if (laptopOn) { console.log('Laptop nyala, skip.'); return; }
              await sendMsg('⏰ *Reminder terakhir malam ini!*\nLogbook belum diisi hari ini.\n\n👉 ' + logbookLink + '\n\n_Deadline: 23:59 malam ini!_');
              return;
            }

            const laptopOn = await checkHeartbeat().catch(() => false);
            if (laptopOn) {
              console.log('Laptop nyala hari ini, logbook automation aktif. Exit.');
              return;
            }

            console.log('Laptop tidak terdeteksi (kemungkinan izin).');
            let lastId = await getLastId();
            let replied = false;
            let count = 0;

            // === FASE 1: Jam 09:00-10:00 — SPAM tiap 3 detik selama 60 menit ===
            if (nowHour < 10) {
              console.log('=== FASE SPAM (09:00-10:00): tiap 3 detik ===');
              const spamEnd = Date.now() + 60 * 60 * 1000; // 60 menit

              while (Date.now() < spamEnd && !replied) {
                const c = await checkReply(lastId);
                lastId = c.lastId;
                if (c.replied) { replied = true; break; }

                await sendMsg(SPAMS[count % SPAMS.length]);
                count++;
                if (count % 50 === 0) console.log('[Spam #' + count + '] terkirim...');

                await sleep(3000); // 3 detik
              }

              if (!replied) console.log('Fase spam selesai (' + count + ' pesan). Lanjut 15-menit...');
            }

            // === FASE 2: Tiap 15 menit hingga akhir job (90 menit per run) ===
            if (!replied) {
              console.log('=== FASE 15 MENIT ===');
              const jobEnd = Date.now() + (nowHour < 10 ? 30 : 90) * 60 * 1000; // sisa waktu job

              while (Date.now() < jobEnd && !replied) {
                const c = await checkReply(lastId);
                lastId = c.lastId;
                if (c.replied) { replied = true; break; }

                await sendMsg(SPAMS[count % SPAMS.length]);
                count++;
                console.log('[Reminder #' + count + '] tiap-15-menit terkirim jam ' + new Date().toLocaleString('id-ID', {timeZone:'Asia/Jakarta'}));

                // Tunggu 15 menit sambil cek reply tiap 30 detik
                const waitUntil = Date.now() + 15 * 60 * 1000;
                while (Date.now() < waitUntil && !replied) {
                  await sleep(30000);
                  const c2 = await checkReply(lastId);
                  lastId = c2.lastId;
                  if (c2.replied) { replied = true; }
                }
              }
            }

            if (replied) {
              await sendMsg('✅ *Oke! Langsung isi logbook di sini:*\n\n👉 ' + logbookLink + '\n\n_Ingat: deadline 23:59 malam ini!_');
              console.log('User replied! Link logbook dikirim. SELESAI.');
            } else {
              console.log('Job selesai. Run berikutnya akan lanjut cek.');
            }
          }

          main().catch(e => { console.error(e); process.exit(1); });
          ENDSCRIPT
          node /tmp/reminder.mjs