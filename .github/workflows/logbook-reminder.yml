name: Logbook Reminder
on:
  schedule:
    - cron: '30 2 * * 1-5'   # 09:30 WIB — spam burst 1 (10 pesan)
    - cron: '0 3 * * 1-5'    # 10:00 WIB — mulai 15 menit
    - cron: '30 4 * * 1-5'   # 11:30 WIB — lanjut 15 menit
    - cron: '0 5 * * 1-5'    # 12:00 WIB — spam burst 2 (tiap 3-4 detik, 1 jam)
    - cron: '30 6 * * 1-5'   # 13:30 WIB — lanjut 15 menit
    - cron: '0 8 * * 1-5'    # 15:00 WIB — lanjut 15 menit
    - cron: '30 9 * * 1-5'   # 16:30 WIB — lanjut 15 menit
    - cron: '0 11 * * 1-5'   # 18:00 WIB — lanjut 15 menit
    - cron: '30 12 * * 1-5'  # 19:30 WIB — lanjut 15 menit
    - cron: '0 14 * * 1-5'   # 21:00 WIB — lanjut 15 menit
    - cron: '30 15 * * 1-5'  # 22:30 WIB — spam burst 3 final (hingga 23:59)
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      CHAT_ID: ${{ secrets.CHAT_ID }}
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GIST_ID: ${{ secrets.GIST_ID }}
    steps:
      - name: Check heartbeat and remind if needed
        run: |
          cat > /tmp/reminder.mjs << 'ENDSCRIPT'
          const token = process.env.TELEGRAM_TOKEN;
          const chatId = process.env.CHAT_ID;
          const ghToken = process.env.GH_TOKEN;
          const gistId = process.env.GIST_ID;

          function getTodayWIB() {
            return new Date().toLocaleString('sv-SE', { timeZone: 'Asia/Jakarta' }).split(' ')[0];
          }
          function getNowHourWIB() {
            return parseInt(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta', hour: 'numeric', hour12: false }));
          }
          function getNowMinWIB() {
            return parseInt(new Date().toLocaleString('en-US', { timeZone: 'Asia/Jakarta', minute: 'numeric' }));
          }
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          async function checkHeartbeat() {
            const today = getTodayWIB();
            const r = await fetch('https://api.github.com/gists/' + gistId, {
              headers: { Authorization: 'token ' + ghToken, Accept: 'application/vnd.github.v3+json' }
            });
            const d = await r.json();
            const hb = JSON.parse(d.files['heartbeat.json'].content);
            return hb.date === today;
          }

          async function sendMsg(text) {
            const r = await fetch('https://api.telegram.org/bot' + token + '/sendMessage', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, text, parse_mode: 'Markdown' })
            });
            const d = await r.json();
            if (d.ok) return d.result.message_id;
            console.log('Send error:', JSON.stringify(d));
            return null;
          }

          async function deleteMsg(msgId) {
            if (!msgId) return;
            await fetch('https://api.telegram.org/bot' + token + '/deleteMessage', {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: chatId, message_id: msgId })
            });
          }

          // Simpan/baca message IDs ke Gist untuk auto-delete
          async function loadSpamIds() {
            try {
              const r = await fetch('https://api.github.com/gists/' + gistId, {
                headers: { Authorization: 'token ' + ghToken, Accept: 'application/vnd.github.v3+json' }
              });
              const d = await r.json();
              if (d.files['spam-ids.json']) {
                return JSON.parse(d.files['spam-ids.json'].content);
              }
            } catch(e) {}
            return [];
          }

          async function saveSpamIds(ids) {
            const body = JSON.stringify({
              files: { 'spam-ids.json': { content: JSON.stringify(ids) } }
            });
            await fetch('https://api.github.com/gists/' + gistId, {
              method: 'PATCH', headers: { Authorization: 'token ' + ghToken, Accept: 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
              body
            });
          }

          // Hapus pesan spam yang sudah > 1 jam
          async function deleteOldSpam() {
            const ids = await loadSpamIds();
            const now = Date.now();
            const stillNew = [];
            for (const item of ids) {
              if (now - item.sentAt > 60 * 60 * 1000) {
                await deleteMsg(item.msgId);
                console.log('Auto-deleted msg:', item.msgId);
              } else {
                stillNew.push(item);
              }
            }
            await saveSpamIds(stillNew);
            return stillNew;
          }

          async function sendAndTrack(text, trackedIds) {
            const msgId = await sendMsg(text);
            if (msgId) trackedIds.push({ msgId, sentAt: Date.now() });
            return msgId;
          }

          async function checkReply(lastId) {
            const r = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?offset=' + (lastId + 1) + '&timeout=2&limit=5');
            const d = await r.json();
            if (d.ok && d.result.length > 0) return { replied: true, lastId: d.result[d.result.length-1].update_id };
            return { replied: false, lastId };
          }

          async function getLastId() {
            const r = await fetch('https://api.telegram.org/bot' + token + '/getUpdates?limit=1&timeout=0');
            const d = await r.json();
            if (d.ok && d.result.length) return d.result[d.result.length-1].update_id;
            return 0;
          }

          const SPAMS = [
            '⚠️ *LOGBOOK BELUM DIISI!*\nSeperti nya kamu izin hari ini—segera isi logbook manual!\n_(Balas pesan ini untuk dapat link)_',
            '🔔 *PENGINGAT LOGBOOK!*\nLogbook MagangHub belum terisi hari ini!\n_(Balas untuk link pengisian)_',
            '📋 *Hei, logbook dulu!*\nDeadline 23:59 malam ini, jangan sampai lupa!\n_(Balas untuk link langsung)_',
            '🚨 *LOGBOOK BELUM KEISI!*\nSegera isi sebelum kelewatan! Balas pesan ini! 👇',
            '⏰ *Jangan lupa logbook!*\nMasih ada waktu—balas untuk link pengisian! 👇',
            '😤 *Halo?? Logbook belum diisi nih!*\nBalas pesan ini sekarang! 👇',
            '📌 *REMINDER KERAS: LOGBOOK!*\nKamu tidak mau rugi kan? Balas sekarang! 👇',
            '🔴 *Ini sudah hampir siang!*\nLogbook masih belum keisi, ayo balas sekarang! 👇',
            '💀 *TERAKHIR PERINGATAN!*\nLogbook belum diisi. Balas untuk dapat link! 👇',
            '😱 *ADA YANG LUPA LOGBOOK NIH!*\nItu kamu. Balas sekarang untuk link pengisian! 👇',
          ];

          async function main() {
            const today = getTodayWIB();
            const h = getNowHourWIB();
            const m = getNowMinWIB();
            const logbookLink = 'https://monev.maganghub.kemnaker.go.id/dashboard/riwayat?date=' + today + '&view=edit';

            console.log('Jam WIB:', h + ':' + String(m).padStart(2,'0'), '| Tanggal:', today);

            // Hapus spam lama > 1 jam dulu
            const trackedIds = await deleteOldSpam();

            const laptopOn = await checkHeartbeat().catch(() => false);
            if (laptopOn) { console.log('Laptop nyala, automation aktif. Skip.'); return; }
            console.log('Laptop OFF. Mulai reminder...');

            let lastId = await getLastId();
            let replied = false;
            let count = 0;

            async function checkAfterSend() {
              const c = await checkReply(lastId);
              lastId = c.lastId;
              if (c.replied) replied = true;
            }

            // ===== ZONA 1: 09:30-10:00 — 10 pesan, jeda 3 detik =====
            if (h === 9 && m >= 30) {
              console.log('=== ZONA SPAM 09:30 (10 pesan) ===');
              for (let i = 0; i < 10 && !replied; i++) {
                await checkAfterSend();
                if (replied) break;
                await sendAndTrack(SPAMS[i], trackedIds);
                count++;
                console.log('Spam #' + count);
                await sleep(3000);
              }
            }

            // ===== ZONA 2: 10:00-12:00 — tiap 15 menit =====
            else if (h >= 10 && h < 12) {
              console.log('=== ZONA 15 MENIT (10:00-12:00) ===');
              const jobEnd = Date.now() + 90 * 60 * 1000;
              while (Date.now() < jobEnd && !replied) {
                await checkAfterSend(); if (replied) break;
                await sendAndTrack(SPAMS[count % SPAMS.length], trackedIds); count++;
                console.log('Reminder #' + count + ' terkirim');
                const waitEnd = Date.now() + 15 * 60 * 1000;
                while (Date.now() < waitEnd && !replied) { await sleep(30000); await checkAfterSend(); }
              }
            }

            // ===== ZONA 3: 12:00-13:00 — spam tiap 3-4 detik =====
            else if (h === 12) {
              console.log('=== ZONA SPAM SIANG 12:00 (tiap 3-4 detik, 1 jam) ===');
              const spamEnd = Date.now() + 60 * 60 * 1000;
              while (Date.now() < spamEnd && !replied) {
                await checkAfterSend(); if (replied) break;
                await sendAndTrack(SPAMS[count % SPAMS.length], trackedIds); count++;
                if (count % 30 === 0) console.log('Spam siang #' + count);
                await sleep(3000 + Math.random() * 1000); // 3-4 detik random
              }
            }

            // ===== ZONA 4: 13:00-22:30 — tiap 15 menit =====
            else if (h >= 13 && (h < 22 || (h === 22 && m < 30))) {
              console.log('=== ZONA 15 MENIT (13:00-22:30) ===');
              const jobEnd = Date.now() + 90 * 60 * 1000;
              while (Date.now() < jobEnd && !replied) {
                await checkAfterSend(); if (replied) break;
                await sendAndTrack(SPAMS[count % SPAMS.length], trackedIds); count++;
                console.log('Reminder #' + count + ' terkirim');
                const waitEnd = Date.now() + 15 * 60 * 1000;
                while (Date.now() < waitEnd && !replied) { await sleep(30000); await checkAfterSend(); }
              }
            }

            // ===== ZONA 5: 22:30-00:00 — spam tiap 3 detik, pesan terakhir sarkasme =====
            else if (h >= 22 || (h === 22 && m >= 30)) {
              console.log('=== ZONA SPAM MALAM 22:30 (hingga 23:59) ===');
              // Hitung sisa waktu hingga 23:59
              const now = new Date();
              const midnight = new Date(now);
              midnight.setHours(23, 59, 0, 0);
              const spamEnd = midnight.getTime();

              while (Date.now() < spamEnd && !replied) {
                await checkAfterSend(); if (replied) break;

                // Cek apakah ini pesan terakhir (< 10 detik sebelum 23:59)
                const isLast = (spamEnd - Date.now()) < 15000;
                if (isLast) {
                  await sendAndTrack(
                    '🎉 *Selamat!* Anda telah resmi kehilangan *±Rp200.000-an* hari ini.\n\nSemoga worth it ya izinnya 😇\n\n👉 ' + logbookLink + '\n\n_Deadline: 23:59 — masih 1 menit lagi, gaskeun!_',
                    trackedIds
                  );
                  break;
                }
                await sendAndTrack(SPAMS[count % SPAMS.length], trackedIds); count++;
                await sleep(3000);
              }

              if (!replied && (spamEnd - Date.now()) <= 0) {
                await sendAndTrack('🎉 *Selamat!* Anda telah resmi kehilangan *±Rp200.000-an* hari ini.\n\nSemoga worth it ya izinnya 😇\n\n👉 ' + logbookLink, trackedIds);
              }
            }

            // Simpan tracked IDs terbaru
            await saveSpamIds(trackedIds);

            if (replied) {
              await sendMsg('✅ *Oke! Langsung isi logbook di sini:*\n\n👉 ' + logbookLink + '\n\n_Deadline: 23:59 malam ini!_');
              console.log('User replied! Link logbook dikirim.');
            }
          }

          main().catch(e => { console.error(e); process.exit(1); });
          ENDSCRIPT
          node /tmp/reminder.mjs